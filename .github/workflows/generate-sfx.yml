name: Generate NMIX SFX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate NMIX sound files
        run: node scripts/generate-sfx.js

      - name: Show generated files
        run: ls -lh assets/sfx/

      - name: Commit generated SFX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/sfx/

          if git diff --cached --quiet; then
            echo "No new SFX files to commit."
            exit 0
          fi

          git commit -m "Add NMIX UI sound effects"
          git push
