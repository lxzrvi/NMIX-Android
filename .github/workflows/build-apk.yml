name: Build NMIX Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure npm
        run: npm config set legacy-peer-deps true

      - name: Clean and install dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install

      - name: Install NMIX native packages
        run: |
          npx expo install react-native-svg expo-splash-screen expo-image-picker expo-file-system expo-screen-orientation

      - name: Check Expo project
        run: npx expo-doctor

      - name: Test JavaScript bundle
        run: npx expo export --platform android --output-dir dist

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload NMIX APK
        uses: actions/upload-artifact@v4
        with:
          name: NMIX-Android-Release
          path: android/app/build/outputs/apk/release/app-release.apk
