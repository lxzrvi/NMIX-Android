name: Build NMIX Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Calculate version FIRST.
      # If anything is wrong here, Gradle time
      # will not be wasted.
      - name: Calculate NMIX version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG="$(
            gh release list \
              --limit 100 \
              --json tagName \
              --jq '.[].tagName' 2>/dev/null |
            grep -E '^v[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )"

          if [ -z "$LAST_TAG" ]; then
            NEXT_VERSION="v1.0"
          else
            VERSION="${LAST_TAG#v}"

            MAJOR="${VERSION%%.*}"
            MINOR="${VERSION##*.}"

            if [ "$MINOR" -ge 9 ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
            else
              MINOR=$((MINOR + 1))
            fi

            NEXT_VERSION="v${MAJOR}.${MINOR}"
          fi

          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "NMIX release will be ${NEXT_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure npm
        run: npm config set legacy-peer-deps true

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      # Keep the known-working native dependencies.
      - name: Install NMIX native packages
        run: |
          npx expo install react-native-svg expo-splash-screen expo-image-picker expo-file-system expo-screen-orientation expo-audio

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel

      - name: Prepare NMIX APK
        run: |
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            "release/NMIX-${{ steps.version.outputs.version }}.apk"

      - name: Upload NMIX APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMIX-${{ steps.version.outputs.version }}
          path: release/NMIX-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: NMIX ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            NMIX — everything with numbers

            Native Android release
            Package: com.lxz.nmix
            Version: ${{ steps.version.outputs.version }}
          files: release/NMIX-${{ steps.version.outputs.version }}.apk
