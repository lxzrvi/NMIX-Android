name: Build NMIX Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure npm
        run: npm config set legacy-peer-deps true

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/NMIX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMIX-Android-Release
          path: release/NMIX.apk
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nmix-build-${{ github.run_number }}
          name: NMIX Build ${{ github.run_number }}
          body: |
            NMIX Android native release build.

            Package: com.lxz.nmix
            APK: NMIX.apk
            Commit: ${{ github.sha }}
          files: release/NMIX.apk
